spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:/data/aibe.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # A pool of 3 was too small: the app runs several concurrent async
      # pipelines (suggestion execution, expert reviews) whose @Transactional
      # callbacks each check out a connection, on top of HTTP traffic and the
      # @Scheduled timeout sweep. That routinely exhausted the pool, producing
      # "HikariPool-1 - Connection is not available". SQLite in WAL mode
      # supports many concurrent readers (writes still serialize via
      # busy_timeout), so a larger pool is safe and removes the contention.
      maximum-pool-size: 10
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;"
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080
  max-http-request-header-size: 16KB

logging:
  level:
    com.sitemanager.service.ClaudeService: INFO
    com.sitemanager.service.SuggestionService: INFO
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: ERROR
    org.springframework.security.web.DefaultSecurityFilterChain: OFF
    org.apache.coyote.http11.Http11Processor: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  workspace-dir: /workspace
  claude-cli-path: claude
  suggestion-timeout-minutes: 1440
  claude-timeout-minutes: 30
  # Model for main operations (evaluate, execute). Empty = CLI default.
  claude-model: ${CLAUDE_MODEL:}
  # Faster/cheaper model for expert reviews and feedback validation. Empty = uses claude-model.
  claude-model-expert: ${CLAUDE_MODEL_EXPERT:}
  # Max turns for expert reviews (limits tool-use loops). Default 6.
  claude-max-turns-expert: ${CLAUDE_MAX_TURNS_EXPERT:6}
  # Max concurrent Claude CLI processes. Prevents resource exhaustion during batch expert reviews.
  claude-max-concurrent: ${CLAUDE_MAX_CONCURRENT:2}
  # Max Claude CLI calls per minute (sliding window). Prevents runaway loops from overwhelming the API.
  claude-max-calls-per-minute: ${CLAUDE_MAX_CALLS_PER_MINUTE:10}
  git-ssh-key-path: ${GIT_SSH_KEY_PATH:}
  # Enable verbose CLI logging: logs full command, real-time stdout, and response at INFO level.
  # Also passes --verbose to the Claude CLI subprocess for turn-by-turn output.
  claude-verbose: ${CLAUDE_VERBOSE:false}
  # When running as root, run Claude CLI and git subprocesses as this user instead.
  # The user must exist in the container. Leave empty to disable (run as current user).
  claude-run-as-user: ${CLAUDE_RUN_AS_USER:}
  # Claude CLI subcommand driven by the interactive login flow. `auth login`
  # prints the OAuth URL on a single plain line the web login relay can parse.
  # `setup-token` launches the full-screen TUI, which wraps the URL at the
  # terminal width and breaks URL extraction — do not use it for this flow.
  # Rotating-token staleness is handled by persistRefreshedCredentialsIfChanged.
  claude-login-command: ${CLAUDE_LOGIN_COMMAND:auth login}
